[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idx-cli"
version = "1.0.0"
description = "IDX Technical Analysis & Screener CLI Terminal"
readme = "README.md"
authors = [{ name = "@rifkydelta" }]
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "typer[all]>=0.9.0",
]

[project.scripts]
idx = "idx_cli.main:app"
